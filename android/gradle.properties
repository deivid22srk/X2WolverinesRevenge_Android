# Propriedades do build Android.
#
# Documentação honesta: NADA aqui é específico do jogo. O objetivo é manter
# o build reproduzível no runner do CI (7 GB de RAM) sem depender de estado
# local da máquina de quem clona o repositório.

# AndroidX obrigatório (as bibliotecas usadas no :app são todas AndroidX).
android.useAndroidX=true

# Cada módulo gera apenas seu próprio R: o :app é o único módulo hoje, mas
# isso evita surpresas (pacotes de R inflados) quando um módulo for criado.
android.nonTransitiveRClass=true

# JVM do Gradle. O código lifted do jogo é enorme; o daemon padrão estoura
# com o volume de classes/recursos gerados no merge. -Xmx4g foi escolhido
# para caber no runner de 7 GB deixando RAM para o processo de CMake.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Sem daemon: o CI roda o Gradle uma vez e morre. Um daemon ficaria com 4 GB
# presos no fim do job.
org.gradle.daemon=false

# Caminho de configuração em paralelo (o :app sozinho já se beneficia da
# configuração antecipada do AGP).
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin: o Kotlin 1.9 ainda usa o modo "old" do compilador por padrão. O
# modo novo reduz o consumo de memória com muitos arquivos.
kotlin.code.style=official
