# Wrapper do Gradle. O CI usa `gradle/actions/setup-gradle` com a mesma
# versão (8.7) e NÃO usa o wrapper; este arquivo existe para que um clone
# local tenha exatamente a mesma versão do CI.
#
# O gradle-wrapper.jar NÃO está versionado (binário, gerado por
# `gradle wrapper`). O CI não precisa dele: ele invoca `gradle` direto.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
